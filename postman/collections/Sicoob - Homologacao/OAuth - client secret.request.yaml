$kind: http-request
name: OAuth - client secret
method: POST
url: '{{sicoob_oauth_token_url}}'
order: 1000
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Accept
    value: application/json
body:
  type: urlencoded
  content:
    - key: grant_type
      value: client_credentials
      description: Fluxo de credenciais da aplicacao.
    - key: client_id
      value: '{{sicoob_client_id}}'
    - key: client_secret
      value: '{{sicoob_client_secret}}'
    - key: scope
      value: '{{sicoob_scope}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("OAuth respondeu com sucesso", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      pm.test("Resposta possui token OAuth valido", function () {
        const corpo = pm.response.json();
        pm.expect(corpo.access_token).to.be.a("string").and.not.empty;
        pm.expect(corpo.token_type || "Bearer").to.be.a("string");
        pm.expect(Number(corpo.expires_in)).to.be.above(0);
      });
